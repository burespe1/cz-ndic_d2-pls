cs:
  perex: 'Tento dokument popisuje datový formát, používaný pro publikaci sad předdefinovaných poloh – úseků silniční sítě, na které odkazují zprávy jiných formátů (například stavové informace z plovoucích vozidel nebo výstrahy meteohlásek). Odkazující zpráva nese jen identifikátor a verzi polohy, úplný popis je v sadě: liniová poloha na jedné komunikaci popsaná metodami ALERT-C, OpenLR, úseky sítě Global Network a průběhem v souřadnicích WGS-84. Sada obsahuje polohy jednoho druhu a s novým vydáním sítě dostávají polohy novou verzi. Formát vychází z publikace PredefinedLocationsPublication modelu DATEX II 3.7.'
  keywords: DATEX II, NDIC, PredefinedLocationsPublication
en:
  perex: 'This document describes the data format used to publish sets of predefined locations – road network sections referenced by messages of other formats (for example traffic status from floating car data or weather station warnings). A referencing message carries only the identifier and version of the location; the full description is in the set: a linear location on a single road described by ALERT-C, OpenLR, Global Network sections and the course in WGS-84 coordinates. A set contains locations of one kind, and a new network release gives the locations a new version. The format is based on the PredefinedLocationsPublication of the DATEX II 3.7 model.'
  keywords: DATEX II, NDIC, PredefinedLocationsPublication
